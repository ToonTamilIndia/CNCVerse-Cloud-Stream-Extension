name: Build CS3

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build all modules
        run: ./gradlew assemble --no-daemon

      - name: Generate CS3 packages
        run: ./gradlew make --no-daemon

      - name: Upload CS3 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cs3-builds
          path: "**/build/*.cs3"
          if-no-files-found: error

      - name: Push to builds branch
        if: github.ref == 'refs/heads/master'
        run: |
          set -e
          mkdir -p /tmp/cs3-builds
          find . -path "*/build/*.cs3" -exec cp {} /tmp/cs3-builds/ \;
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
          git fetch origin
          git checkout -B builds origin/builds || git checkout --orphan builds
          git rm -f *.cs3 2>/dev/null || true
          if ls /tmp/cs3-builds/*.cs3 >/dev/null 2>&1; then
            cp /tmp/cs3-builds/*.cs3 .
          fi
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update builds from master ${{ github.sha }}"
            git push origin builds
          else
            echo "No changes to commit"
          fi
