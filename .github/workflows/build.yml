name: Build CS3

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build all modules
        run: ./gradlew assemble --no-daemon

      - name: Generate CS3 packages
        run: ./gradlew make --no-daemon

      - name: Upload CS3 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cs3-builds
          path: "**/build/*.cs3"
          if-no-files-found: error

      - name: Push to builds branch
        if: github.ref == 'refs/heads/master'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git fetch origin builds
          git checkout builds
          git rm --ignore-unmatch *.cs3
          find .. -path "*/build/*.cs3" -exec cp {} . \;
          git add *.cs3
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update builds from master ${{ github.sha }}"
            git push origin builds
          else
            echo "No changes to commit"
          fi
